# k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-deployment
  labels:
    app: aceest-fitness
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
  template:
    metadata:
      labels:
        app: aceest-fitness
    spec:
      containers:
      - name: aceest-fitness-container
        image: 2024tm93564/aceest-fitness:v3.2.4
        ports:
        - containerPort: 5000
        imagePullPolicy: Always