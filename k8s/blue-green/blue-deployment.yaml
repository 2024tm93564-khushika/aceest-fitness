apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  labels:
    project: aceest-fitness
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest
      version: blue
  template:
    metadata:
      labels:
        app: aceest
        version: blue
        project: aceest-fitness
    spec:
      containers:
      - name: aceest
        image: 2024tm93564/aceest-fitness:v3.1.2
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5