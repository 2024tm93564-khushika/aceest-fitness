apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  labels:
    project: aceest-fitness
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aceest-canary
      track: stable
  template:
    metadata:
      labels:
        app: aceest-canary
        track: stable
        project: aceest-fitness
    spec:
      containers:
      - name: aceest
        image: 2024tm93564/aceest-fitness:v3.1.2
        ports:
        - containerPort: 5000