apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-version-a
  labels:
    project: aceest-fitness
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-ab
      track: a
  template:
    metadata:
      labels:
        app: aceest-ab
        track: a
        project: aceest-fitness
    spec:
      containers:
      - name: aceest
        image: 2024tm93564/aceest-fitness:v3.1.2
        ports:
        - containerPort: 5000